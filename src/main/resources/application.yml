spring:
  application:
    name: my-spring-batch

  profiles:
    default: dev

  datasource:
    url: jdbc:mysql://localhost:3306/my-spring-batch?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      schema-locations: classpath:sql/init-my-batch-job.sql
      mode: always

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    configprops:
      show-values: ALWAYS

batch:
  partition:
    grid-size: 10  # number of parallel partitions (match your DB connection pool size)
