services:
  mysql:
    image: mysql:8.4
    container_name: my-spring-batch-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-my-spring-batch}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - batch-network

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: my-spring-batch-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-my-spring-batch}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "8080:8080"
    volumes:
      - job_source:/var/job/source
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - batch-network

volumes:
  mysql_data:
  job_source:

networks:
  batch-network:
    driver: bridge
